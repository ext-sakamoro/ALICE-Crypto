# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-Crypto 用に調整
#
# ALICE-Crypto 自体は AGPL-3.0、target crate として license exception で自己許可
# sibling path dep はゼロ、alice-stubs action は no-op (stub 生成不要)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # canonical CI template から継承 (ALICE-* エコシステム標準の
    # unmaintained / transitive dep 由来 warning)
    "RUSTSEC-2024-0436",  # paste 1.0.15 unmaintained (proc-macro transitive)
    "RUSTSEC-2025-0141",  # bincode 2.x unmaintained (postcard 移行コスト高)
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained (egui / font transitive)
    "RUSTSEC-2026-0204",  # (canonical template 継承、ecosystem 標準 ignore)
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow (0.24.1+ で fix)
    "RUSTSEC-2026-0176",  # pyo3 nth/nth_back OOB (0.29 で fix)
    "RUSTSEC-2026-0177",  # pyo3 PyCFunction::new_closure Sync 欠落 (0.29 で fix)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (canonical 罠 #14)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # LLVM ecosystem
    "NCSA",
    # Data license
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ALICE-Crypto 自身 (target crate) が AGPL-3.0 だが cargo-deny は target も
# license check 対象にするため exception で自己許可
# (canonical [[reference_alice_ci_canonical_template]] 罠 #7 target-side 版)
[[licenses.exceptions]]
name = "alice-crypto"
allow = ["AGPL-3.0", "AGPL-3.0-only"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
