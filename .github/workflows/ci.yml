name: CI

# Shared ALICE-* CI layout: test / clippy / no_std / feature-powerset / fmt /
# doc / actionlint. Each job is here because a defect reached main through it
# at least once.
# 2026-09-15 新設 (それまで fuzz / security-audit のみで test / clippy / doc は CI 未実行、crates.io 公開 crate):
# - test / clippy / doc を default + full native feature set (std,ffi) で `-D warnings`
# - no_std job: 0.4.0 までは `crate-type` に cdylib があり、std なしの build は panic_handler /
#   allocator を要求して落ちた (thumbv7em は cdylib を黙って落とすので見えなかった) 0.4.1 で cdylib を外し、
#   `consumers/no_std` (std なしで依存する下流 crate) を host / wasm32-unknown-unknown / thumbv7em で build する
#   bare-metal と wasm32-unknown-unknown は getrandom 非対応 target なので `custom-rng` 込み
# - feature-powerset: std 固定 depth 2 (std なしの組合せは no_std job で検証)
# - sibling path dep なし (2026-09-16: no-op だった stub action は撤去)

on:
  push:
    # `ci/**` runs the same checks on a branch before it is fast-forwarded onto main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  NATIVE_FEATURES: "std,ffi"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default)
        run: cargo test
      - name: Test (full native feature set)
        run: cargo test --features "$NATIVE_FEATURES"

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at run
    # time in both profiles (scripts/run_tests.sh float_environment=2 fails unless
    # both tests passed), the static build configuration guard, and on ubuntu /
    # macOS the flags cargo really passes to rustc, read from `-v` in a fresh
    # target directory (scripts/build_flags_check.py); and ALICE-Law G10 on each
    # OS: the dp noise stream of a fixed key (tests/dp_noise_golden.rs)
    name: Float environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      # ALICE-Law G10: the noise stream of a fixed key, pinned by digest on
      # each OS (a key replayed on another machine must give the same noise)
      - name: DP noise golden (debug and release)
        run: |
          cargo test --test dp_noise_golden
          cargo test --release --test dp_noise_golden
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      - name: Effective rustc flags (default, full native feature set, no default features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "$NATIVE_FEATURES"
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's): its own tests, then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml (0 here);
      # the IR half is .github/workflows/g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (full native feature set, all targets)
        run: cargo clippy --features "$NATIVE_FEATURES" --all-targets -- -D warnings
      # the list in clippy.toml (ALICE-Law G1) only gates anything if clippy
      # flags a call to it: a throwaway crate with the same clippy.toml plants
      # one banned call per row of scripts/clippy_canary_calls.tsv (0 rows
      # fail). The rows are generated from clippy.toml, one per
      # disallowed-methods / disallowed-types entry; --check fails when the file
      # has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # a ban on an external crate's function covers that one path: every
      # public function of each external module the list names (getrandom,
      # read from rustdoc JSON of the version in Cargo.lock) must be banned
      # or allowed with a reason in scripts/clippy_external_allow.toml
      - name: Clippy external coverage (tests)
        run: python3 scripts/test_clippy_external_coverage.py
      - name: Clippy external coverage (every public function of a named module is banned or allowed)
        run: python3 scripts/clippy_external_coverage.py

  no_std:
    name: no_std (host + wasm32 + bare-metal thumbv7em, and a downstream crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (no_std, host, no alloc)
        run: cargo build --lib --no-default-features
      - name: Build (no_std + alloc, host)
        run: cargo build --lib --no-default-features --features alloc
      - name: Build (no_std + alloc + custom-rng, bare-metal thumbv7em-none-eabihf)
        run: cargo build --lib --no-default-features --features alloc,custom-rng --target thumbv7em-none-eabihf
      - name: Clippy (no_std + alloc + custom-rng, bare-metal)
        run: cargo clippy --lib --no-default-features --features alloc,custom-rng --target thumbv7em-none-eabihf -- -D warnings
      # a crate that depends on alice-crypto without std builds the declared
      # crate-types, which the builds above (of alice-crypto itself) do not show
      # the way a user sees them; both rlibs must be reported for every target
      - name: Downstream no_std crate (host, wasm32-unknown-unknown, thumbv7em)
        run: python3 scripts/no_std_consumer.py
      - name: Downstream no_std crate (checker tests)
        run: python3 scripts/test_no_std_consumer.py

  feature-powerset:
    name: Feature powerset (cargo-hack, std 固定, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Powerset (std + {alloc, ffi, custom-rng} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --features std

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      # dp の δ: 切り捨ての各項を有理数で厳密に計算し、定数 (BERNOULLI_STEPS 等) と
      # 文書 (module doc の表、README、CHANGELOG) と cost model の数字を突き合わせる
      - name: DP δ budget (exact)
        run: python3 scripts/dp_delta_budget.py
      - name: No generated file is tracked (tests and check)
        run: |
          python3 scripts/test_tracked_generated_check.py
          python3 scripts/tracked_generated_check.py
      - name: Exact flip probability of randomized_response
        run: python3 scripts/dp_rr_exact.py

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc (full native feature set)
        run: cargo doc --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
