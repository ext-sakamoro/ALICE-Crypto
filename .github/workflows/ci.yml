name: CI

# canonical CI template: [[reference_alice_ci_canonical_template]] 手順 4.5 / 4.6
# 2026-09-15 新設 (それまで fuzz / security-audit のみで test / clippy / doc は CI 未実行、crates.io 公開 crate):
# - test / clippy / doc を default + full native feature set (std,ffi) で `-D warnings`
# - no_std job: `crate-type` に cdylib を含むため `cargo check --no-default-features` は panic_handler /
#   allocator 要求で落ちる → `cargo rustc --crate-type rlib`、bare-metal thumbv7em は getrandom 非対応 target
#   なので `custom-rng` feature (getrandom/custom) 込みで build (rust-toolchain.toml の `targets` で
#   pinned toolchain 側に target install)
# - feature-powerset: std 固定 depth 2 (std なしの組合せは cdylib link 要求で落ちるため no_std job 側で検証)
# - sibling path dep なし (alice-stubs は no-op、canonical 構成維持のため呼ぶ)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  NATIVE_FEATURES: "std,ffi"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default)
        run: cargo test
      - name: Test (full native feature set)
        run: cargo test --features "$NATIVE_FEATURES"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (full native feature set, all targets)
        run: cargo clippy --features "$NATIVE_FEATURES" --all-targets -- -D warnings

  no_std:
    name: no_std (rlib、host + bare-metal thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (no_std, host, no alloc)
        run: cargo rustc --lib --no-default-features --crate-type rlib
      - name: Build (no_std + alloc, host)
        run: cargo rustc --lib --no-default-features --features alloc --crate-type rlib
      - name: Build (no_std + alloc + custom-rng, bare-metal thumbv7em-none-eabihf)
        run: cargo rustc --lib --no-default-features --features alloc,custom-rng --crate-type rlib --target thumbv7em-none-eabihf
      # cargo clippy は crate-type を上書きできないので clippy-driver を wrapper で差す
      - name: Clippy (no_std + alloc + custom-rng, bare-metal)
        run: >-
          RUSTC_WORKSPACE_WRAPPER="$(rustup which clippy-driver)"
          cargo rustc --lib --no-default-features --features alloc,custom-rng --crate-type rlib
          --target thumbv7em-none-eabihf -- -D warnings

  feature-powerset:
    name: Feature powerset (cargo-hack, std 固定, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Powerset (std + {alloc, ffi, custom-rng} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --features std

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc (full native feature set)
        run: cargo doc --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
