name: dp on wasm32

# The differential-privacy noise (`dp`) runs in browsers and at the edge, so its
# oracles and the noise golden run on wasm32-wasip1 under wasmtime, in release, one
# test file per job. The golden pins the noise bits, so a passing run on wasm is the
# same noise as on the host. The envelope and chunked oracles run the same way (their
# formats are sealed and opened in browsers too). Each job must report more than 0
# passing tests.
# Only changes that can move dp run it (patterns: .github/paths/wasm-dp.txt): one
# file takes about 6 minutes.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/wasm-dp.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/dp.rs'
      - 'tests/dp_*.rs'
      - 'src/envelope.rs'
      - 'src/chunked.rs'
      - 'src/stream.rs'
      - 'src/random.rs'
      - 'tests/envelope_oracle.rs'
      - 'tests/chunked_oracle.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/wasm-dp.yml'
      - 'scripts/changed_paths.py'
      - '.github/paths/wasm-dp.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed (scripts/changed_paths.py decide); any error runs (fail-closed)
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/wasm-dp.txt

  dp:
    name: dp — ${{ matrix.test }} (wasm32-wasip1)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # dp_timing measures wall-clock timing and is host-only
        test:
          - dp_noise_golden
          - dp_mechanisms_oracle
          - dp_discrete_laplace_oracle
          - dp_lattice_oracle
          - dp_noise_oracle
          - dp_cost_model
          # the envelope and chunked AEAD formats, which browser and edge consumers seal and open
          - envelope_oracle
          - chunked_oracle
    steps:
      - uses: actions/checkout@v5
      # the toolchain and its wasm32-wasip1 target come from rust-toolchain.toml (the pin);
      # a target installed on another toolchain is not seen by cargo here
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-dp
      # wasmtime at a pinned version and checksum: the setup action takes "latest" (once without
      # assets yet) and its download host once answered 504; the binary is cached by version and
      # the download retried, a mismatching checksum fails
      - name: Cache wasmtime
        id: wasmtime-cache
        uses: actions/cache@v6
        with:
          path: ~/.wasmtime-v49.0.2
          key: wasmtime-v49.0.2-x86_64-linux
      - name: Install wasmtime
        if: steps.wasmtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz
          mkdir -p ~/.wasmtime-v49.0.2
          # first source: the release tarball, checked against its recorded SHA-256
          if curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/wasmtime.tar.xz" "$url"; then
            echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C ~/.wasmtime-v49.0.2 --strip-components=1
          else
            # second source when the release host keeps failing: the same version from crates.io,
            # with the crate's own lock file (cargo checks every downloaded crate's checksum)
            echo "release download failed; building wasmtime-cli 49.0.2 from crates.io"
            cargo install wasmtime-cli --version 49.0.2 --locked --root "$RUNNER_TEMP/wasmtime-cli"
            cp "$RUNNER_TEMP/wasmtime-cli/bin/wasmtime" ~/.wasmtime-v49.0.2/wasmtime
          fi
      - name: Check wasmtime runs
        shell: bash
        run: |
          echo "$HOME/.wasmtime-v49.0.2" >> "$GITHUB_PATH"
          "$HOME/.wasmtime-v49.0.2/wasmtime" --version
      - name: Test under wasmtime (release), more than 0 passing
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          T: ${{ matrix.test }}
        run: |
          set -o pipefail
          cargo test --release --target wasm32-wasip1 --test "$T" 2>&1 | tee test.log
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' test.log | awk '{s+=$1} END {print s+0}')
          echo "dp on wasm32-wasip1: $T: $passed passed"
          if [ "$passed" -le 0 ]; then
            echo "::error::$T ran 0 tests on wasm32-wasip1"
            exit 1
          fi

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, dp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
