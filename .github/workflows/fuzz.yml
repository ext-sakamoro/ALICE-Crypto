name: Fuzz

# Shared ALICE-* fuzz layout: build every target on nightly, then replay the
# corpus time-boxed. The build is the hard gate; the replay is informational
# because a timeout is not a crash.
# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-Crypto 用に調整
#
# 目的:
# - 3 fuzz target を time-boxed 実行 (cryptographic library として fuzz は最高価値):
#   - fuzz_hash_input: BLAKE3 hash が任意 bytes で panic しないこと
#   - fuzz_encrypt_decrypt_roundtrip: XChaCha20-Poly1305 の in-place encrypt→decrypt bit-exact
#   - fuzz_signature_verify: BLAKE3-MAC sign/verify の任意 bytes 耐性
#
# 罠:
# - cargo-fuzz は nightly toolchain 必須

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/fuzz.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - 'scripts/changed_paths.py'
      - '.github/paths/fuzz.txt'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  fuzz:
    name: Fuzz — ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # build + a 60 s run normally take under 10 min
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_hash_input
          - fuzz_encrypt_decrypt_roundtrip
          - fuzz_signature_verify
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (job-level continue-on-error だと fuzz target の compile error が
      #  green 表示で silent になる)
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # run は informational: crash 発見は block せず artifact で triage
      # A crash fails the job (it is a defect, not informational). Each
      # target must also execute at least one input: a run that never executed
      # anything is not a pass. fuzz/regressions/<target> (committed crash
      # inputs) is replayed as an extra corpus, so a fixed crash stays fixed.
      # The summary records runs and libFuzzer's coverage
      - name: Run fuzz target (time-boxed)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cd fuzz
          T="${{ matrix.target }}"
          extra=()
          if [ -d "regressions/$T" ]; then extra=("regressions/$T"); fi
          mkdir -p "corpus/$T"
          set +e
          cargo +nightly fuzz run "$T" "corpus/$T" "${extra[@]}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} 2>&1 | tee fuzz-run.log
          rc=${PIPESTATUS[0]}
          set -e
          runs=$(grep -oE "Done [0-9]+ runs" fuzz-run.log | tail -1 | grep -oE "[0-9]+" || true)
          cov=$(grep -oE "DONE +cov: [0-9]+" fuzz-run.log | tail -1 | grep -oE "[0-9]+$" || true)
          status=ok
          if [ "$rc" -ne 0 ]; then status="crashed (exit $rc)"; fi
          # the row is written before failing, so a crash still shows up here
          echo "| $T | ${runs:-0} runs | cov ${cov:-?} | $status |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ "${runs:-0}" -le 0 ]; then
            echo "::error::fuzz target $T executed 0 inputs"
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
