[package]
name = "alice-crypto"
version = "0.6.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Information-theoretic security primitives for ALICE"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/ext-sakamoro/ALICE-Crypto"
keywords = ["crypto", "sss", "shamir", "blake3", "no_std"]
categories = ["cryptography", "no-std"]

[features]
default = ["std"]
std = ["alloc", "blake3/std", "chacha20poly1305/std", "getrandom/std"]
alloc = ["blake3/traits-preview"]
# Deprecated no-op, removed in 0.5.0: the crate never exported a C ABI, and the
# cdylib output it belonged to was dropped in 0.4.1. Kept so `features = ["ffi"]`
# keeps compiling
ffi = ["std"]
# bare-metal (getrandom 非対応 target) 用: 最終 binary 側で `getrandom::register_custom_getrandom!` を登録する
# 詳細 https://docs.rs/getrandom/0.2/getrandom/macro.register_custom_getrandom.html
custom-rng = ["getrandom/custom"]
# wasm32-unknown-unknown in a JavaScript environment (a browser or Node): the OS random source comes from
# `crypto.getRandomValues` through getrandom's `js` backend (wasm-bindgen; no effect on other targets)
wasm-js = ["std", "getrandom/js"]

[dependencies]
blake3 = { version = "1.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
# 差分プライバシーの noise 源 (`dp`) が素の ChaCha20 keystream を使う
# chacha20poly1305 が既に引いているので依存木は増えない ⚠️ 手書きの block 関数を
# 持つと同じ法則の写しが 2 つになるので、実装は 1 つに寄せる
chacha20 = { version = "0.9", default-features = false }
# OS の乱数: 鍵・nonce・秘密分散の係数と、`dp` の鍵 (seed を渡さない時) を作る
getrandom = { version = "0.2", default-features = false }
# 秘密を落とす時の 0 埋めに使う 手書きの `*b = 0` は「以降読まれない書き込み」として
# 消されうるので、volatile write + fence を持つ実装に任せる
# (chacha20poly1305 が既に引いているので依存木は増えない)
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# memory-hard な password からの鍵導出 (`kdf::argon2id`、RFC 9106)
# 自前の BLAKE2b と Argon2 の写しを持たず、RustCrypto の実装を薄く包む
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

# The DP samplers do a fixed, large amount of work per draw (they are
# constant-time); their distribution tests draw tens of thousands of samples
[profile.test]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[dev-dependencies]
# SHA-256 of the recorded-bit scenarios (tests/semantics_golden.rs) and of the
# semantics identifier fold (tests/crypto_semantics_id.rs)
sha2 = "0.10"
