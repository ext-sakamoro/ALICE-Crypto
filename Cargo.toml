[package]
name = "alice-crypto"
version = "0.7.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Information-theoretic security primitives for ALICE"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Crypto"
keywords = ["crypto", "sss", "shamir", "blake3", "no_std"]
categories = ["cryptography", "no-std"]

[features]
default = ["std"]
# the standard library and every module (the build every consumer had before 0.7)
std = ["std-base", "full"]
# the standard library, the OS random source and the always-present modules (dp, gf256, keystore,
# random, semantics) without any module feature: dp with `SecureRng::try_from_entropy` and nothing of
# the AEAD, KDF, key-exchange or hash dependencies (add module features for those)
std-base = ["alloc", "rng", "getrandom?/std", "blake3?/std", "chacha20poly1305?/std", "sha2?/std", "hmac?/std", "hkdf?/std", "aes-gcm?/std"]
# every module
full = ["hash", "sha256", "aead", "kdf", "x25519", "hpke"]
# BLAKE3 (`hash`), and the modules built on it: `mac`, `signature`, `sss`
hash = ["dep:blake3"]
# SHA-256, HMAC-SHA256 and HKDF-SHA256 (`sha256`)
sha256 = ["dep:sha2", "dep:hmac", "dep:hkdf"]
# the AEADs (`stream`, `chacha20poly1305_ietf`, `aes_gcm`, `aead`) and the formats on them (`envelope`, `chunked`)
aead = ["dep:chacha20poly1305", "dep:aes-gcm"]
# password and key derivation (`kdf`: Argon2id, HKDF-BLAKE3)
kdf = ["hash", "dep:argon2"]
# X25519 key agreement (`x25519`)
x25519 = ["dep:x25519-dalek"]
# HPKE (RFC 9180) base mode for the MLS cipher suite (`hpke`)
hpke = ["aead", "sha256", "x25519"]
# The operating system's random source (getrandom): key, nonce and share generation, `random::fill`, the
# HPKE sender, `SecureRng::try_from_entropy` and the chunked sealer's prefix. `std` turns it on; without it
# (`default-features = false`) the hashes, MACs, KDFs, AEADs with a given key, envelope and dp from a key
# build on every target (wasm32-unknown-unknown included) and no getrandom is linked
rng = ["dep:getrandom"]
alloc = ["blake3?/traits-preview"]
# Deprecated no-op, removed in 0.5.0: the crate never exported a C ABI, and the
# cdylib output it belonged to was dropped in 0.4.1. Kept so `features = ["ffi"]`
# keeps compiling
ffi = ["std"]
# bare-metal (getrandom 非対応 target) 用: 最終 binary 側で `getrandom::register_custom_getrandom!` を登録する
# 詳細 https://docs.rs/getrandom/0.2/getrandom/macro.register_custom_getrandom.html
custom-rng = ["rng", "getrandom/custom"]
# wasm32-unknown-unknown in a JavaScript environment (a browser or Node): the OS random source comes from
# `crypto.getRandomValues` through getrandom's `js` backend (wasm-bindgen; no effect on other targets)
wasm-js = ["std", "getrandom/js"]

[dependencies]
blake3 = { version = "1.5", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"], optional = true }
# 差分プライバシーの noise 源 (`dp`) が素の ChaCha20 keystream を使う
# chacha20poly1305 が既に引いているので依存木は増えない ⚠️ 手書きの block 関数を
# 持つと同じ法則の写しが 2 つになるので、実装は 1 つに寄せる
chacha20 = { version = "0.9", default-features = false }
# OS の乱数: 鍵・nonce・秘密分散の係数と、`dp` の鍵 (seed を渡さない時) を作る
getrandom = { version = "0.2", default-features = false, optional = true }
# 秘密を落とす時の 0 埋めに使う 手書きの `*b = 0` は「以降読まれない書き込み」として
# 消されうるので、volatile write + fence を持つ実装に任せる
# (chacha20poly1305 が既に引いているので依存木は増えない)
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# memory-hard な password からの鍵導出 (`kdf::argon2id`、RFC 9106)
# 自前の BLAKE2b と Argon2 の写しを持たず、RustCrypto の実装を薄く包む
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"], optional = true }
# MLS (RFC 9420) cipher suite 0x0001 の primitive: SHA-256 / HMAC / HKDF、X25519、AES-128-GCM
# (HPKE RFC 9180 は src/hpke.rs が key schedule だけを書き、計算はこの 5 crate) 手書きの写しは持たない
sha2 = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
x25519-dalek = { version = "2", default-features = false, optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

# The DP samplers do a fixed, large amount of work per draw (they are
# constant-time); their distribution tests draw tens of thousands of samples
[profile.test]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[dev-dependencies]
# SHA-256 of the recorded-bit scenarios (tests/semantics_golden.rs) and of the
# semantics identifier fold (tests/crypto_semantics_id.rs)
sha2 = "0.10"
