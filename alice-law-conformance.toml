# ALICE-Law conformance manifest for this crate (alice-crypto). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the library and test suites were run (default and
# release profile), clippy was run with the crate's own configuration, and a
# type-resolved disallowed-methods probe (not committed) was run over every
# feature set. This crate has no Law wiring yet (no clippy ban list, no
# release or aarch64 test leg, no arithmetic identifier, no public-text step),
# so no gate is `pass`: `unverified` means not decided by a committed check,
# `fail-known` means checked and the required thing is absent at the place
# named. The floating-point code of this crate is the dp module; its sampler is
# integer arithmetic with exact rational budgets, and the f64 operations in
# src/dp.rs are conversions, bit manipulation and exact scaling.

[G1]
status = "unverified"
since = ""
note = "A probe with a type-resolved disallowed-methods list (every banned f32/f64 method of the G1 list plus powi, max and min, not committed) over cargo clippy --lib for the default, --no-default-features, --no-default-features --features alloc, --features std,ffi and --features custom-rng builds reported 0 sites in src/; adding f64::sin to src/hash.rs made the probe report it (and the addition was reverted), so the library has no direct call today. Unmet: the crate has no clippy.toml and no CI job with disallowed-methods, no canary test, and no dependency on alice-det-math, so nothing committed keeps it that way. The probe also reports f64::exp, f64::powi, f64::max and f64::min in the reference oracles tests/dp_discrete_laplace_oracle.rs:28,29,51,82,83,86,113,115, tests/dp_mechanisms_oracle.rs:27,28,107, tests/dp_noise_oracle.rs:298,299 and tests/dp_lattice_oracle.rs:89 (independent closed-form references, outside src/). The choice for powi (pending in the G1 list) is not stated by the crate."
reference_repo = ""

[G2]
status = "unverified"
since = ""
note = "The G2 probe (f32/f64 max and min banned, not committed) reports 0 sites in src/ in every feature set; the only max/min calls in src/ are on integers (src/dp.rs:265 u64::min, src/kdf.rs:83 usize::min). Unmet: no committed clippy ban, no Law max/min helper, no raw_* manifest, no SIMD width list (the crate has no SIMD code) and no (+0,-0) test, so the gate has no committed check. The oracles tests/dp_noise_oracle.rs:298-299 call f64::min and f64::max outside src/."
reference_repo = ""

[G3]
status = "unverified"
since = ""
note = "src/ has no mul_add call (grep over src, tests, fuzz and consumers finds none) so no outer negation of an fma result exists today, but the repository has no syntax-tree checker for it and no canary, so the absence is not kept by a committed check."
reference_repo = ""

