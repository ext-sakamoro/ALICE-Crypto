# ALICE-Law conformance manifest for this crate (alice-crypto). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the library and test suites were run (default and
# release profile), clippy was run with the crate's own configuration, and a
# type-resolved disallowed-methods probe (not committed) was run over every
# feature set. Every `pass` carries a measured mutant; `n/a` (G7 to G9) is measured
# by scripts/law_boundary_scan.py; `unverified` means not checked yet,
# `fail-known` means checked and the requirement is unmet, with the place
# (or the absent file, step or test) named. The floating-point code of this crate is the dp module; its sampler is
# integer arithmetic with exact rational budgets, and the f64 operations in
# src/dp.rs are conversions, bit manipulation and exact scaling.

