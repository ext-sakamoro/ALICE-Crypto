[G6]
status = "fail-known"
since = ""
note = "Absent: src/lib.rs (203 lines) exports no SEMANTICS_ID or equivalent and no test pins one (grep for SEMANTICS finds nothing in src, tests and CHANGELOG.md). The dp module is the crate's Law-bearing part (a key reproduces the same noise, src/dp.rs, tests/dp_noise_oracle.rs:104), so its pins (lattice rule, BERNOULLI_STEPS, the keystream construction) are not folded into an identifier, and Cargo.toml has no alice-det-math dependency to fold an upstream identifier from."
reference_repo = ""

[G7]
status = "unverified"
since = ""
note = "Not decided. The type-erasing entry points are src/stream.rs:262 seal and :285 open (nonce plus ciphertext bytes), the key store in src/keystore.rs and the signature bytes in src/signature.rs; they carry bytes, and the crate receives no Law-bearing value of another crate (no dependency on one), but without a G6 identifier there is nothing to compare, and whether a DP key or noise stream counts as a Law-bearing value crossing a boundary is not decided. The crate has no extern \"C\", no_mangle, wasm-bindgen, pyo3, dyn Any or build.rs (grep over src and the repository root)."
reference_repo = ""

[G8]
status = "unverified"
since = ""
note = "Not decided. The durable forms the crate writes are src/stream.rs seal (nonce plus ciphertext) and the key store of src/keystore.rs; neither stores a dp output or an arithmetic identifier, and the dp noise is re-derived from a key, not stored. Without a G6 identifier there is nothing to persist; whether the sealed forms are Law-bearing is the open question."
reference_repo = ""

[G9]
status = "unverified"
since = ""
note = "Depends on G6 and G8: the crate has no identifier, so there is no identifier history to audit (git log -S SEMANTICS_ID has nothing to find)."
reference_repo = ""

[G10]
status = "unverified"
since = ""
note = "src/ reads no wall clock or monotonic clock (the probe with SystemTime::now and Instant::now banned reports 0 in src/; the one Instant::now is tests/dp_timing.rs:25). It reads OS entropy at src/stream.rs:60 and :104, src/keystore.rs:110 and :172, src/sss.rs:115, src/signature.rs:33 and src/dp.rs:243 (DpNoise::try_from_entropy and the Laplace mechanism's try_from_entropy at :880): key, nonce and share generation of a cryptographic crate, with the deterministic path taking the key as a parameter (dp::SecureRng::with_key, DpNoise::with_key at :857). Whether those entropy constructors are inside the gate is a design decision not made here, and no lint or CI scan with a canary exists."
reference_repo = ""

