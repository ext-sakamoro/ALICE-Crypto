reference_repo = ""

[G5]
status = "fail-known"
since = ""
note = "Absent: .github/workflows/ci.yml:36 and :38 run cargo test and cargo test --features \"$NATIVE_FEATURES\" without --release on ubuntu-latest (ci.yml:30), and no workflow has an aarch64 runner. cargo test --release was run locally on the commit this file is added on (all 9 test binaries ok) but no CI leg runs it. Cargo.toml:48 sets opt-level = 3 for the test profile, which optimises the tests but is not the release profile and not an aarch64 leg."
