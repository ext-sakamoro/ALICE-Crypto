# ALICE-Law conformance manifest for this crate (alice-crypto). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the library and test suites were run (default and
# release profile), clippy was run with the crate's own configuration, and a
# type-resolved disallowed-methods probe (not committed) was run over every
# feature set. The Law wiring is partial (no release or aarch64 test leg, no
# arithmetic identifier); G1, G12 and G14 are `pass` with a measured mutant, and the other gates are not: `unverified` means not checked yet,
# `fail-known` means checked and the requirement is unmet, with the place
# (or the absent file, step or test) named. The floating-point code of this crate is the dp module; its sampler is
# integer arithmetic with exact rational budgets, and the f64 operations in
# src/dp.rs are conversions, bit manipulation and exact scaling.

[G1]
status = "pass"
evidence = [
    "clippy.toml disallowed-methods (lines 28 to 79: every f32 and f64 method gates.toml marks banned, sin_cos at lines 30 and 56, plus powi, the pending default, banned for both); the entries are the f32 / f64 method part of the ALICE-DB and alice-zip lists (52 entries; the libm free functions of the alice-zip list are not needed, see the last item)",
    ".github/workflows/ci.yml clippy job: default, all targets (line 87); full native feature set std,ffi, all targets (line 89); no_std job: alloc + custom-rng, lib, thumbv7em-none-eabihf (line 121); every run -D warnings; scripts/preflight.sh lines 46, 50 and 70 run the same sets. src/ has no feature-gated code (only the crate-level no_std attribute), so the library sets above lint every line of it",
    "scripts/clippy_canary.py with scripts/clippy_canary_calls.tsv, which scripts/gen_clippy_canary_calls.py generates from clippy.toml with one row per disallowed-methods / disallowed-types entry (52 planted, 0 skipped; f64::sin and f64::sin_cos are lines 36 and 38): each call is planted in a throwaway crate that copies clippy.toml and must get exactly one disallowed diagnostic naming it, every clippy.toml entry must have exactly one row, 0 rows or 0 entries fail; scripts/test_clippy_canary.py and scripts/test_gen_clippy_canary_calls.py (all four byte-identical to ALICE-DB); run by .github/workflows/ci.yml lines 96 to 103 and scripts/preflight.sh lines 53, 54, 57 and 229",
    "Cargo.toml has no libm dependency and Cargo.lock has no libm package, so no libm free function can be named from this crate's source; every float transcendental is a method on f32 / f64, which the list covers",
]
mutant = "measured 2026-10-17, each reverted: deleting the f64::exp entry from clippy.toml makes scripts/clippy_canary.py exit 1 with 'data line 50: `f64::exp` is not listed under disallowed-methods in clippy.toml'; adding `let _ = core::hint::black_box(0.5_f64).sin();` to hash() in src/hash.rs makes the default all-targets clippy step exit 101 with disallowed method `f64::sin` at src/hash.rs:50"
since = ""
note = "every banned method of the G1 list is in clippy.toml and src/ has 0 sites in every linted set. The banned names that remain are the closed-form references of the dp oracles, each under a scoped #[expect(clippy::disallowed_methods)] with its reason (it fails if the call goes away): tests/dp_discrete_laplace_oracle.rs lines 27, 78 and 103, tests/dp_mechanisms_oracle.rs lines 26 and 100, tests/dp_lattice_oracle.rs line 80 (f64::exp and f64::powi; their expected values must not come from the integer sampler under test). f64::max and f64::min in tests/dp_noise_oracle.rs are G2, not G1."
reference_repo = "ALICE-DB"

