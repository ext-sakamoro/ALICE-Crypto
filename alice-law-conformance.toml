status = "unverified"
since = ""
note = "Not decided. The type-erasing entry points are src/stream.rs:262 seal and :285 open (nonce plus ciphertext bytes), the key store in src/keystore.rs and the signature bytes in src/signature.rs; they carry bytes, and the crate receives no Law-bearing value of another crate (no dependency on one), but without a G6 identifier there is nothing to compare, and whether a DP key or noise stream counts as a Law-bearing value crossing a boundary is not decided. The crate has no extern \"C\", no_mangle, wasm-bindgen, pyo3, dyn Any or build.rs (grep over src and the repository root)."
