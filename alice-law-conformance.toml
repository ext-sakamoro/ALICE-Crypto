# ALICE-Law conformance manifest for this crate (alice-crypto). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the library and test suites were run (default and
# release profile), clippy was run with the crate's own configuration, and a
# type-resolved disallowed-methods probe (not committed) was run over every
# feature set. This crate has no Law wiring yet (no clippy ban list, no
# release or aarch64 test leg, no arithmetic identifier, no public-text step),
# so no gate is `pass`: `unverified` means not checked yet,
# `fail-known` means checked and the requirement is unmet, with the place
# (or the absent file, step or test) named. The floating-point code of this crate is the dp module; its sampler is
# integer arithmetic with exact rational budgets, and the f64 operations in
# src/dp.rs are conversions, bit manipulation and exact scaling.

[G1]
status = "fail-known"
since = ""
note = "Absent: the repository has no clippy.toml or .clippy.toml (so no disallowed-methods list), the clippy steps at .github/workflows/ci.yml:49-52 run cargo clippy with -D warnings only and no disallowed_methods ban, and there is no canary test. A probe with a type-resolved disallowed-methods list (every banned f32/f64 method of the G1 list plus powi, max and min, not committed) over cargo clippy --lib for the default, --no-default-features, --no-default-features --features alloc, --features std,ffi and --features custom-rng builds reported 0 sites in src/; adding f64::sin to src/hash.rs made the probe report it (and the addition was reverted), so the library has no direct call today. The crate also has no dependency on alice-det-math, so nothing committed keeps it that way. The probe also reports f64::exp, f64::powi, f64::max and f64::min in the reference oracles tests/dp_discrete_laplace_oracle.rs:28,29,51,82,83,86,113,115, tests/dp_mechanisms_oracle.rs:27,28,107, tests/dp_noise_oracle.rs:298,299 and tests/dp_lattice_oracle.rs:89 (independent closed-form references, outside src/). The choice for powi (pending in the G1 list) is not stated by the crate."
reference_repo = ""

